<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="page-heading">
      <p class="eyebrow">A LITTLE MORE ORGANIZED</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">Keep track of what you need to do, one task at a time.</p>
    </header>
    <section class="todo-card" aria-label="To-do list">
      <form id="task-form" class="add-form">
        <label class="sr-only" for="task-input">New task</label>
        <input id="task-input" type="text" placeholder="What do you need to do?" maxlength="120" autocomplete="off" required>
        <button type="submit" class="primary-button">Add task</button>
      </form>
      <div class="list-heading">
        <h2>My tasks <span id="task-count" class="count">0</span></h2>
        <button id="clear-completed" class="text-button" type="button">Clear completed</button>
      </div>
      <nav class="filters" aria-label="Filter tasks">
        <button class="filter active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </nav>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty-message">No tasks yet. Add one above to get started.</p>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>
    <footer><span>Simple To-Do List</span><span>Made with HTML, CSS and JavaScript</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
